name: CI — cacheit-server

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # ktlintCheck, not ktlintFormat — Format rewrites files and always
      # exits 0, so it can never fail a PR. Check is read-only and is the
      # actual gate.
      - name: ktlint check
        run: ./gradlew ktlintCheck --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      # Confirm whether this repo actually has a separate `integrationTest`
      # source set for the Testcontainers tests, or whether they run inside
      # plain `test` above. If there's no such task this step fails loud
      # ("task not found") rather than silently skipping — fix by either
      # adding the source set or deleting this step, don't leave it guessing.
      - name: Integration tests (Testcontainers)
        run: ./gradlew integrationTest --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7
