name: Release & Deploy — Prod + Demo

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only when release-please just merged its Release PR and cut a real
  # tag. Builds ONE image and deploys it to both prod and demo — they are
  # always the same release by design, never built or tagged separately.
  build-and-deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cacheit-server:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/${{ github.repository_owner }}/cacheit-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to prod over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: cacheit-ci
          key: ${{ secrets.CACHEIT_CI_SSH_KEY }}
          script: /opt/cacheit/deploy.sh prod

      - name: Deploy to demo over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: cacheit-ci
          key: ${{ secrets.CACHEIT_CI_SSH_KEY }}
          script: /opt/cacheit/deploy.sh demo
